<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | escape }} | Penport India</title>
    <meta name="description" content="{{ page.description | escape }}" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#00d4ff" />
    <link rel="canonical" href="{{ page.url | absolute_url }}" />
    <meta property="og:site_name" content="Penport India" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:type" content="{% if page.layout == 'blog-single-post' %}article{% else %}website{% endif %}" />
    <meta property="og:title" content="{{ page.title | escape }} | Penport India" />
    <meta property="og:description" content="{{ page.description | escape }}" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:image" content="https://i.ibb.co/ym5yxYwM/Penport-logo-001.png" />
    <meta property="og:image:alt" content="Penport India insights and resources" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ page.title | escape }} | Penport India" />
    <meta name="twitter:description" content="{{ page.description | escape }}" />
    <meta name="twitter:image" content="https://i.ibb.co/ym5yxYwM/Penport-logo-001.png" />
    {% if page.layout == 'blog-single-post' %}
    <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}" />
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"BlogPosting","headline":{{ page.title | jsonify }},"description":{{ page.description | jsonify }},"datePublished":{{ page.date | date_to_xmlschema | jsonify }},"dateModified":{{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},"mainEntityOfPage":{{ page.url | absolute_url | jsonify }},"image":"https://i.ibb.co/ym5yxYwM/Penport-logo-001.png","author":{"@type":"Organization","name":{{ page.author | jsonify }},"url":{{ '/' | absolute_url | jsonify }}},"publisher":{"@type":"Organization","name":"Penport India","url":{{ '/' | absolute_url | jsonify }},"logo":{"@type":"ImageObject","url":"https://i.ibb.co/ym5yxYwM/Penport-logo-001.png"}}}
    </script>
    {% endif %}
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":{{ '/' | absolute_url | jsonify }}},{"@type":"ListItem","position":2,"name":"Blog","item":{{ '/blog/' | absolute_url | jsonify }}}{% if page.layout == 'blog-single-post' %},{"@type":"ListItem","position":3,"name":{{ page.title | jsonify }},"item":{{ page.url | absolute_url | jsonify }}}{% endif %}]}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="https://i.ibb.co/ym5yxYwM/Penport-logo-001.png" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/css/components.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}" />
    <link rel="alternate" type="application/atom+xml" title="Penport India Blog" href="{{ '/feed.xml' | relative_url }}" />
</head>
<body data-page="blog">
    <a class="blog-skip" href="#blogMain">Skip to content</a>
    <header class="wide-page-header">
        <a class="wide-brand" href="{{ '/index.html' | relative_url }}">Penport<span>India</span></a>
        <nav aria-label="Page navigation">
                <a class="header-icon" href="{{ '/index.html' | relative_url }}" aria-label="Home" title="Home">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>
                </a>
                <a class="header-icon" href="{{ '/catalogue.html' | relative_url }}" aria-label="Explore projects" title="Explore projects">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="11" rx="1.5"/><rect x="14" y="3" width="7" height="6" rx="1.5"/><rect x="3" y="18" width="7" height="3" rx="1"/><rect x="14" y="13" width="7" height="8" rx="1.5"/></svg>
                </a>
                <a class="header-icon header-icon-demo" href="{{ '/book-demo.html' | relative_url }}" aria-label="Book a demo" title="Book a demo">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18m-12 5 2 2 4-4"/></svg>
                </a>
                <a class="header-icon" href="{{ '/blog/' | relative_url }}" aria-current="page" aria-label="Blog" title="Blog">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h4"/></svg>
                </a>
            </nav>
    </header>
    <main id="blogMain" class="blog-shell">{{ content }}</main>
    <footer class="site-footer"><p>&copy; 2025 Penport India</p></footer>
    <script src="{{ '/assets/js/blog.js' | relative_url }}" defer></script>
</body>
</html>
