{% assign seo_title = page.seo_title | default: page.title %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ seo_title | escape }} | Penport India</title>
    <meta name="description" content="{{ page.description | escape }}" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#f3fbff" />
    <link rel="canonical" href="{{ page.url | absolute_url }}" />
    <meta property="og:site_name" content="Penport India" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:type" content="{% if page.layout == 'blog-single-post' %}article{% else %}website{% endif %}" />
    <meta property="og:title" content="{{ seo_title | escape }} | Penport India" />
    <meta property="og:description" content="{{ page.description | escape }}" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:image" content="https://i.ibb.co/ym5yxYwM/Penport-logo-001.png" />
    <meta property="og:image:alt" content="Penport India insights and resources" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ seo_title | escape }} | Penport India" />
    <meta name="twitter:description" content="{{ page.description | escape }}" />
    <meta name="twitter:image" content="https://i.ibb.co/ym5yxYwM/Penport-logo-001.png" />
    {% if page.layout == 'blog-single-post' %}
    <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}" />
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"BlogPosting","headline":{{ page.title | jsonify }},"description":{{ page.description | jsonify }},"datePublished":{{ page.date | date_to_xmlschema | jsonify }},"dateModified":{{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},"mainEntityOfPage":{{ page.url | absolute_url | jsonify }},"image":"https://i.ibb.co/ym5yxYwM/Penport-logo-001.png","author":{"@type":"Organization","name":{{ page.author | jsonify }},"url":{{ '/' | absolute_url | jsonify }}},"publisher":{"@type":"Organization","name":"Penport India","url":{{ '/' | absolute_url | jsonify }},"logo":{"@type":"ImageObject","url":"https://i.ibb.co/ym5yxYwM/Penport-logo-001.png"}}}
    </script>
    {% endif %}
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":{{ '/' | absolute_url | jsonify }}},{"@type":"ListItem","position":2,"name":"Blog","item":{{ '/blog/' | absolute_url | jsonify }}}{% if page.layout == 'blog-single-post' %},{"@type":"ListItem","position":3,"name":{{ page.title | jsonify }},"item":{{ page.url | absolute_url | jsonify }}}{% endif %}]}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="https://i.ibb.co/ym5yxYwM/Penport-logo-001.png" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=20261120" />
    <link rel="stylesheet" href="{{ '/assets/css/components.css' | relative_url }}?v=20261120-menu-icon" />
    <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}?v=20261120-reading" />
    <link rel="alternate" type="application/atom+xml" title="Penport India Blog" href="{{ '/feed.xml' | relative_url }}" />
</head>
<body data-page="blog">
    <a class="blog-skip" href="#blogMain">Skip to content</a>
    <header class="site-masthead">
        <div class="site-masthead-inner">
            <a class="site-wordmark" href="{{ '/index.html' | relative_url }}" aria-label="Penport India"><img src="https://i.ibb.co/ym5yxYwM/Penport-logo-001.png" alt="" width="40" height="40" decoding="async" /><span>enport <strong>India</strong></span></a>
            <button class="site-menu-toggle" type="button" aria-expanded="false" aria-controls="siteNavigation" aria-label="Menu" hidden><span class="site-menu-icon" aria-hidden="true"></span></button>
            <nav class="site-navigation" id="siteNavigation" aria-label="Page navigation">
                <a href="{{ '/index.html' | relative_url }}">Home</a>
                <a href="{{ '/catalogue.html' | relative_url }}">Explore</a>
                <a href="{{ '/blog/' | relative_url }}" aria-current="page">Blog</a>
                <a href="{{ '/book-demo.html' | relative_url }}" class="site-nav-cta">Book</a>
            </nav>
        </div>
    </header>
    <main id="blogMain" class="blog-shell">{{ content }}</main>
    <footer class="site-footer">
        <div class="site-footer-inner">
            <div class="site-footer-identity">
                <a href="{{ '/index.html' | relative_url }}">Penport India</a>
                <p>&copy; 2025 Penport India</p>
            </div>
            <nav aria-label="Footer navigation">
                <a href="{{ '/catalogue.html' | relative_url }}">Explore</a>
                <a href="{{ '/school-management-software.html' | relative_url }}">School MS</a>
                <a href="{{ '/blog/' | relative_url }}">Blog</a>
                <a href="{{ '/book-demo.html' | relative_url }}">Book</a>
            </nav>
        </div>
    </footer>
    <script src="{{ '/assets/js/main.js' | relative_url }}?v=20261120" defer></script>
    <script src="{{ '/assets/js/blog.js' | relative_url }}" defer></script>
</body>
</html>
